<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Scanner check mode test</title>
<style>html,body{margin:0;height:100%}body{display:flex;flex-direction:column;overflow:hidden}#test-controls{flex:0 0 auto;padding:8px 10px;box-sizing:border-box;background:#fff3c5;color:#222;font:13px system-ui}#root{height:auto!important;min-height:0;flex:1}button{font:inherit;margin:2px}</style></head>
<body>
<div id="test-controls">Sesión y Supabase simulados: no toca datos reales.
  <button data-card="Pikachu|58/102">Pikachu 58/102</button>
  <button data-card="Charmander|46/102">Charmander 46/102</button>
  <button data-card="Charmander|69/130">Charmander 69/130</button>
  <button data-card="Mewtwo|10/102">Mewtwo 10/102</button>
  <button data-photo="gastly-phone.jpg">Foto Gastly</button>
  <span id="writes"></span></div>
<div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
// Isolated storage and a made-up user: the real session, if any, is never read or used.
const data = new Map();
const storage = { getItem: key => data.get(key) ?? null, setItem: (key, value) => data.set(key, String(value)), removeItem: key => data.delete(key), clear: () => data.clear(), key: index => [...data.keys()][index] ?? null, get length() { return data.size; } };
Object.defineProperty(window, 'localStorage', { value: storage });
const supabaseHost = new URL(import.meta.env.VITE_SUPABASE_URL).host;
const user = { id: 'scanner-check-test-user', aud: 'authenticated', role: 'authenticated', email: 'test@example.test', app_metadata: {}, user_metadata: {}, created_at: '2026-01-01T00:00:00Z' };
storage.setItem(`sb-${supabaseHost.split('.')[0]}-auth-token`, JSON.stringify({ access_token: 'test', refresh_token: 'test', token_type: 'bearer', expires_in: 3600, expires_at: Math.floor(Date.now() / 1000) + 3600, user }));

const collection = (id, name, managed_by = null, parent_id = null) => ({ id, name, parent_id, is_public: false, managed_by });
const copy = (product_id, collection_id, condition, printing, managed_by = null) => ({ product_id, collection_id, condition, printing, managed_by });
const collections = [collection('own', 'Mi carpeta'), collection('vintage', 'Vintage'), collection('sub', 'Vintage Base', null, 'vintage'), collection('collectr', 'Collectr Binder', 'collectr')];
const copies = [
  copy(42389, 'own', 'Near Mint', 'Normal'), copy(42389, 'own', 'Near Mint', 'Normal'), copy(42389, 'own', 'Lightly Played', 'Normal'),
  copy(107043, 'own', 'Damaged', '1st Edition'),
  copy(42389, 'sub', 'Heavily Played', 'Normal'),
  copy(42389, 'collectr', null, 'Normal', 'collectr'), copy(42389, 'collectr', null, 'Normal', 'collectr'),
  copy(42394, 'collectr', null, 'Normal', 'collectr'),
  copy(42488, 'collectr', null, 'Normal', 'collectr'), copy(42488, 'sub', 'Lightly Played', 'Normal'),
];
const tables = { card_copies: copies, collections, collection_tags: [], collection_printings: [], collectr_collection_meta: [], cards: [] };
const realFetch = window.fetch.bind(window);
const writes = [];
window.__writes = writes;
window.fetch = async (input, init = {}) => {
  const url = new URL(typeof input === 'string' ? input : input.url, location.href);
  if (url.host !== supabaseHost) return realFetch(input, init);
  const method = (init.method ?? input.method ?? 'GET').toUpperCase();
  if (method !== 'GET' && method !== 'HEAD') {
    writes.push(`${method} ${url.pathname}`);
    document.querySelector('#writes').textContent = `Escrituras: ${writes.length}`;
  }
  const table = url.pathname.split('/').pop();
  const rows = url.pathname.startsWith('/rest/') ? tables[table] ?? [] : {};
  return new Response(JSON.stringify(rows), { status: 200, headers: { 'content-type': 'application/json' } });
};

const card = document.createElement('canvas'); card.width = 630; card.height = 880;
const scene = document.createElement('canvas'); scene.width = 900; scene.height = 1200;
const drawName = (name, number) => {
  const context = card.getContext('2d');
  context.fillStyle = '#f5d550'; context.fillRect(0, 0, 630, 880);
  context.fillStyle = '#f8ebbc'; context.fillRect(20, 20, 590, 840);
  context.fillStyle = '#111'; context.font = 'bold 42px Arial'; context.fillText(name, 40, 85);
  context.font = '24px Arial'; context.fillText('40 HP', 500, 85);
  context.fillStyle = '#86b8ce'; context.fillRect(45, 125, 540, 390);
  context.fillStyle = '#111'; context.font = '24px Arial'; context.fillText(number, 485, 835);
};
const drawPhoto = name => new Promise(resolve => {
  const image = new Image();
  image.onload = () => { card.getContext('2d').drawImage(image, 0, 0, 630, 880); resolve(); };
  image.src = `/.codex-remote-attachments/scanner-qa/${name}`;
});
drawName('Charmander', '46/102');
setInterval(() => {
  const frame = scene.getContext('2d'); frame.fillStyle = '#ddd'; frame.fillRect(0, 0, 900, 1200);
  frame.drawImage(card, 72, 72, 756, 1056);
}, 100);
document.querySelector('#test-controls').addEventListener('click', event => {
  const { card: value, photo } = event.target.dataset ?? {};
  if (value) drawName(...value.split('|'));
  if (photo) void drawPhoto(photo);
});
window.__draw = { drawName, drawPhoto };
navigator.mediaDevices.getUserMedia = async () => scene.captureStream(10);
// ?app=... opens the app with other catalog parameters, such as a viewed collection.
history.replaceState(null, '', `/scanner?${new URLSearchParams(location.search).get('app') ?? 'series=Base&cardVariantTopLevel=Standard'}`);
const { default: App } = await import('/src/App.tsx');
createRoot(document.querySelector('#root')).render(React.createElement(App));
</script>
</body></html>
