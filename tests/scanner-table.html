<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Scanner table mode test</title>
<style>html,body{margin:0;height:100%}body{display:flex;flex-direction:column;overflow:hidden}#test-controls{flex:0 0 auto;padding:6px 10px;box-sizing:border-box;background:#fff3c5;color:#222;font:13px system-ui}#root{height:auto!important;min-height:0;flex:1}</style></head>
<body>
<div id="test-controls">Mesa simulada con imágenes reales del catálogo. Sesión y Supabase simulados: no toca datos reales. <span id="writes"></span></div>
<div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
// Isolated storage and a made-up user: the real session, if any, is never read or used.
const data = new Map();
const storage = { getItem: key => data.get(key) ?? null, setItem: (key, value) => data.set(key, String(value)), removeItem: key => data.delete(key), clear: () => data.clear(), key: index => [...data.keys()][index] ?? null, get length() { return data.size; } };
Object.defineProperty(window, 'localStorage', { value: storage });
const supabaseHost = new URL(import.meta.env.VITE_SUPABASE_URL).host;
const user = { id: 'scanner-table-test-user', aud: 'authenticated', role: 'authenticated', email: 'test@example.test', app_metadata: {}, user_metadata: {}, created_at: '2026-01-01T00:00:00Z' };
storage.setItem(`sb-${supabaseHost.split('.')[0]}-auth-token`, JSON.stringify({ access_token: 'test', refresh_token: 'test', token_type: 'bearer', expires_in: 3600, expires_at: Math.floor(Date.now() / 1000) + 3600, user }));

const collection = (id, name, managed_by = null, parent_id = null) => ({ id, name, parent_id, is_public: false, managed_by });
const copy = (product_id, collection_id, condition, printing, managed_by = null) => ({ product_id, collection_id, condition, printing, managed_by });
const tables = {
  card_copies: [copy(107055, 'own', 'Near Mint', '1st Edition'), copy(107055, 'own', 'Lightly Played', '1st Edition'), copy(42402, 'own', 'Near Mint', 'Normal'), copy(44461, 'own', null, 'Unlimited', 'collectr')],
  collections: [collection('own', 'Mi carpeta'), collection('collectr', 'Collectr Binder', 'collectr')],
  collection_tags: [], collection_printings: [], collectr_collection_meta: [], cards: [],
};
const realFetch = window.fetch.bind(window);
window.__writes = [];
window.fetch = async (input, init = {}) => {
  const url = new URL(typeof input === 'string' ? input : input.url, location.href);
  if (url.host !== supabaseHost) return realFetch(input, init);
  const method = (init.method ?? input.method ?? 'GET').toUpperCase();
  if (method !== 'GET' && method !== 'HEAD') window.__writes.push(`${method} ${url.pathname}`);
  const rows = url.pathname.startsWith('/rest/') ? tables[url.pathname.split('/').pop()] ?? [] : {};
  return new Response(JSON.stringify(rows), { status: 200, headers: { 'content-type': 'application/json' } });
};

const scene = document.createElement('canvas'); scene.width = 2400; scene.height = 1800;
const context = scene.getContext('2d');
const grain = () => {
  context.fillStyle = '#86694e'; context.fillRect(0, 0, scene.width, scene.height);
  context.strokeStyle = '#7a5e45'; context.lineWidth = 3;
  for (let y = 0; y < scene.height; y += 37) { context.beginPath(); context.moveTo(0, y); context.bezierCurveTo(800, y + 14, 1600, y - 14, scene.width, y + 6); context.stroke(); }
};
/** Lays same-origin card pictures on a wooden table; `crop` cuts a card out of a real photo. */
window.__layTable = async placements => {
  grain();
  for (const { image, x, y, angle, height = 620, crop } of placements) {
    const bitmap = await createImageBitmap(await fetch(image).then(response => response.blob()));
    const [sx, sy, sw, sh] = crop ?? [0, 0, bitmap.width, bitmap.height];
    context.save(); context.translate(x, y); context.rotate(angle * Math.PI / 180);
    context.shadowColor = '#0006'; context.shadowBlur = 14; context.shadowOffsetY = 5;
    context.drawImage(bitmap, sx, sy, sw, sh, -height * 63 / 88 / 2, -height / 2, height * 63 / 88, height);
    context.restore();
  }
};
window.__sceneFile = () => new Promise(resolve => scene.toBlob(blob => resolve(new File([blob], 'mesa.jpg', { type: 'image/jpeg' })), 'image/jpeg', 0.92));
grain();
// A canvas stream only delivers a frame when the canvas changes.
setInterval(() => { context.fillStyle = '#86694e'; context.fillRect(0, 0, 1, 1); }, 100);
navigator.mediaDevices.getUserMedia = async () => scene.captureStream(10);
history.replaceState(null, '', '/scanner?series=Base');
const { default: App } = await import('/src/App.tsx');
createRoot(document.querySelector('#root')).render(React.createElement(App));
</script>
</body></html>
